<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영수증 투두</title>
<meta name="theme-color" content="#efede8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0 auto;padding:16px;max-width:620px;background:#efede8;color:#1d1d1d}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar button{flex:none;padding:10px 14px;font-size:15px;border:1px solid #1d1d1d;border-radius:6px;background:#fff;color:#1d1d1d}
.bar span{font-size:14px;color:#6b6860}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;font-size:15px;border:1px solid #1d1d1d;border-radius:6px;background:transparent;color:#1d1d1d}
.tabs button.on{background:#1d1d1d;color:#fff}
.pv{background:#f7f5f0;border:1px solid #c9c5bc;border-radius:6px;padding:10px}
.pvp{display:flex;justify-content:center}
#out{width:100%}
#tout{width:192px}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
label{display:block;margin:12px 0 4px;font-size:14px}
select,input[type=file]{width:100%;font-size:15px;padding:6px 0}
input[type=text]{width:100%;box-sizing:border-box;font-size:15px;padding:8px;border:1px solid #c9c5bc;border-radius:6px;background:#fff}
input[type=range]{width:100%}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.row label{display:flex;align-items:center;gap:5px;margin:0}
.item{display:flex;align-items:center;gap:8px;margin:6px 0}
.item input[type=checkbox]{width:22px;height:22px;flex:none}
.item button{flex:none;width:36px;height:36px;border:1px solid #c9c5bc;border-radius:6px;background:#fff;font-size:18px;color:#1d1d1d}
.sub{width:100%;margin-top:6px;padding:10px;font-size:15px;border:1px dashed #9a978f;border-radius:6px;background:transparent;color:#1d1d1d}
#send{width:100%;margin-top:16px;padding:14px;font-size:16px;border:0;border-radius:6px;background:#1d1d1d;color:#fff}
#send:disabled{background:#9a978f}
#msg{margin-top:10px;font-size:14px;min-height:1.3em}
.hint{font-size:13px;color:#6b6860;margin-top:6px}
</style></head><body>

<div class="bar"><button id="conn">기기 연결</button><span id="bstat">연결 안 됨 · 기기 버튼을 꾹 눌러서 깜빡이게 한 뒤 연결</span></div>

<div class="tabs"><button id="tabTodo" class="on">할 일</button><button id="tabPhoto">사진</button></div>

<section id="secPhoto">
<input type="file" id="file" accept="image/*">
<div class="pv" style="margin-top:12px"><canvas id="out" width="296" height="128"></canvas></div>

<label>맞추기</label>
<select id="fit">
<option value="cover">꽉 채우기 (넘치는 건 잘림)</option>
<option value="contain">전체 보이기 (여백 생김)</option>
</select>

<label>디더링</label>
<select id="dither">
<option value="atk">Atkinson (대비 강하고 깔끔)</option>
<option value="fs">Floyd-Steinberg (부드러움)</option>
<option value="bayer">Bayer (규칙적인 망점)</option>
<option value="none">없음 (딱 잘라서 3색)</option>
</select>

<label>밝기 <span id="bv">0</span></label>
<input type="range" id="bright" min="-100" max="100" value="0">
<label>대비 <span id="cv">0</span></label>
<input type="range" id="contrast" min="-100" max="100" value="0">
<label>빨강 민감도 <span id="rv">0</span></label>
<input type="range" id="redbias" min="-100" max="100" value="0">

<div class="row">
<label><input type="checkbox" id="red" checked> 빨강 쓰기</label>
<label><input type="checkbox" id="flip"> 180° 뒤집기</label>
<label><input type="checkbox" id="inv"> 반전</label>
</div>
</section>

<section id="secTodo" hidden>
<div class="pv pvp"><canvas id="tout" width="128" height="296"></canvas></div>
<div class="hint">패널 세로 기준 미리보기. 영수증은 기기 폰트로 그려서 글자 모양이 조금 달라</div>

<label>스타일</label>
<select id="tstyle">
<option value="receipt">영수증</option>
<option value="note">손글씨 노트</option>
</select>
<label>제목</label>
<input type="text" id="ttitle" value="To Do">
<div class="hint">제목이랑 맺음말은 영어만 들어가 (기기가 직접 그려서)</div>
<label>할 일 (체크하면 Done, 최대 9개)</label>
<div id="items"></div>
<button class="sub" id="addItem">+ 항목 추가</button>
<label>맺음말</label>
<input type="text" id="tfoot" value="THANK YOU">
<div class="row">
<label><input type="checkbox" id="tflip"> 위아래 뒤집기</label>
</div>
</section>

<button id="send" disabled>기기로 보내기</button>
<div id="msg">사진을 골라줘</div>

<script>
const W=296,H=128,N=W*H;
const $=id=>document.getElementById(id);
const msg=t=>$('msg').textContent=t;
let res=null;            // 보낼 결과 (가로 296x128). 0=하양 1=검정 2=빨강
let mode='photo';

// 미리보기용 색 (실제 패널 느낌에 가깝게)
const SHOW=[[238,235,226],[28,28,28],[178,34,40]];

/* ================= 탭 ================= */
function setMode(m){
  mode=m;
  $('tabPhoto').classList.toggle('on',m==='photo');
  $('tabTodo').classList.toggle('on',m==='todo');
  $('secPhoto').hidden=m!=='photo';
  $('secTodo').hidden=m!=='todo';
  if(m==='photo'){render();$('send').disabled=!img;msg(img?'미리보기 확인하고 보내면 돼':'사진을 골라줘');}
  else{renderTodo();$('send').disabled=false;msg('항목 적고 보내면 돼. 기기에서 체크할 땐 손잡이로 줄 번호 가리키고 버튼');}
}
$('tabPhoto').onclick=()=>setMode('photo');
$('tabTodo').onclick=()=>setMode('todo');

/* ================= 사진 ================= */
const out=$('out'),octx=out.getContext('2d');
const src=document.createElement('canvas');src.width=W;src.height=H;
const sctx=src.getContext('2d',{willReadFrequently:true});
let img=null;

$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const u=URL.createObjectURL(f), i=new Image();
  i.onload=()=>{img=i;URL.revokeObjectURL(u);render();$('send').disabled=false;msg('미리보기 확인하고 보내면 돼');};
  i.onerror=()=>msg('이미지를 못 읽었어');
  i.src=u;
};
['fit','dither','bright','contrast','redbias','red','flip','inv'].forEach(id=>{
  $(id).addEventListener('input',render);$(id).addEventListener('change',render);
});

function render(){
  $('bv').textContent=$('bright').value;
  $('cv').textContent=$('contrast').value;
  $('rv').textContent=$('redbias').value;
  if(!img) return;

  // 1) 296x128로 맞추기
  sctx.save();
  sctx.fillStyle='#fff';sctx.fillRect(0,0,W,H);
  if($('flip').checked){sctx.translate(W,H);sctx.rotate(Math.PI);}
  const s=$('fit').value==='cover'
    ? Math.max(W/img.width,H/img.height)
    : Math.min(W/img.width,H/img.height);
  const dw=img.width*s,dh=img.height*s;
  sctx.imageSmoothingEnabled=true;sctx.imageSmoothingQuality='high';
  sctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  sctx.restore();
  const d=sctx.getImageData(0,0,W,H).data;

  // 2) 밝기/대비 적용 후 (밝기, 붉은기) 두 채널로 바꿈
  //    RGB 거리로 그냥 고르면 회색이 빨강으로 빠지는 문제가 있어서 이렇게 함
  const b=+$('bright').value*1.28, c=+$('contrast').value*1.5;
  const cf=(259*(c+255))/(255*(259-c));
  const useRed=$('red').checked, inv=$('inv').checked;
  // 붉은기가 이 값보다 약하면 빨강 안 씀 (피부색이 빨간 점투성이 되는 거 방지)
  const T=60-(+$('redbias').value)*0.6;
  const L=new Float32Array(N),R=new Float32Array(N);
  for(let i=0,p=0;p<N;i+=4,p++){
    let r=d[i],g=d[i+1],bl=d[i+2];
    if(inv){r=255-r;g=255-g;bl=255-bl;}
    r=cf*(r-128)+128+b; g=cf*(g-128)+128+b; bl=cf*(bl-128)+128+b;
    L[p]=0.299*r+0.587*g+0.114*bl;
    R[p]=useRed ? Math.max(0,(r-Math.max(g,bl))-T)*255/(255-T) : 0;
  }

  res=dither(L,R,useRed,$('dither').value);
  paint(octx,res,W,H);
}

function dither(L,R,useRed,mode){
  // 팔레트: [밝기, 붉은기]
  const P=useRed?[[255,0],[0,0],[76,200]]:[[255,0],[0,0]];
  const near=(l,r)=>{let bi=0,bd=Infinity;for(let k=0;k<P.length;k++){const a=l-P[k][0],q=r-P[k][1],dd=a*a+q*q;if(dd<bd){bd=dd;bi=k;}}return bi;};
  const o=new Uint8Array(N);

  if(mode==='none'){for(let p=0;p<N;p++)o[p]=near(L[p],R[p]);return o;}

  if(mode==='bayer'){
    const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const p=y*W+x,t=(B[(y&3)*4+(x&3)]+0.5)/16-0.5;
      o[p]=near(L[p]+t*255,R[p]+t*200);
    }
    return o;
  }

  // 오차 확산
  const K=mode==='fs'
    ? [[1,0,7/16],[-1,1,3/16],[0,1,5/16],[1,1,1/16]]
    : [[1,0,1/8],[2,0,1/8],[-1,1,1/8],[0,1,1/8],[1,1,1/8],[0,2,1/8]];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const p=y*W+x,k=near(L[p],R[p]);o[p]=k;
    const el=L[p]-P[k][0],er=R[p]-P[k][1];
    for(const [dx,dy,w] of K){
      const nx=x+dx,ny=y+dy;
      if(nx<0||nx>=W||ny>=H) continue;
      const q=ny*W+nx;L[q]+=el*w;R[q]+=er*w;
    }
  }
  return o;
}

function paint(ctx,arr,w,h){
  const id=ctx.createImageData(w,h);
  for(let p=0,i=0;p<w*h;p++,i+=4){const c=SHOW[arr[p]];id.data[i]=c[0];id.data[i+1]=c[1];id.data[i+2]=c[2];id.data[i+3]=255;}
  ctx.putImageData(id,0,0);
}

/* ================= 할 일 영수증 ================= */
const PW=128,PH=296;   // 세로로 세운 패널
const tout=$('tout'),tctx=tout.getContext('2d');
const tc=document.createElement('canvas');tc.width=PW;tc.height=PH;
const t=tc.getContext('2d',{willReadFrequently:true});
let todos=[{text:'Work 1',done:true},{text:'',done:false},{text:'',done:false}];

const DEF={receipt:{title:'To Do',foot:'THANK YOU'},note:{title:'ToDo',foot:'Thank you'}};

try{const s=JSON.parse(localStorage.getItem('epaper_todo'));if(s){
  todos=s.todos||todos;
  if(s.style)$('tstyle').value=s.style;
  $('ttitle').value=s.title??DEF[$('tstyle').value].title;
  $('tfoot').value=s.foot??DEF[$('tstyle').value].foot;
  $('tflip').checked=!!s.flip;
}}catch(e){}
function save(){try{localStorage.setItem('epaper_todo',JSON.stringify({todos,style:$('tstyle').value,title:$('ttitle').value,foot:$('tfoot').value,flip:$('tflip').checked}));}catch(e){}}

// 스타일 바꿀 때 제목/맺음말이 기본값이면 그 스타일 기본값으로 바꿔줌
let lastStyle=$('tstyle').value;
$('tstyle').addEventListener('change',()=>{
  const st=$('tstyle').value;
  if($('ttitle').value===DEF[lastStyle].title)$('ttitle').value=DEF[st].title;
  if($('tfoot').value===DEF[lastStyle].foot)$('tfoot').value=DEF[st].foot;
  lastStyle=st;renderTodo();
});

function buildItems(){
  const box=$('items');box.innerHTML='';
  todos.forEach((it,i)=>{
    const row=document.createElement('div');row.className='item';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=it.done;
    cb.onchange=()=>{it.done=cb.checked;renderTodo();};
    const tx=document.createElement('input');tx.type='text';tx.value=it.text;tx.placeholder='할 일';
    tx.oninput=()=>{it.text=tx.value;renderTodo();};
    const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','삭제');
    del.onclick=()=>{todos.splice(i,1);buildItems();renderTodo();};
    row.append(cb,tx,del);box.append(row);
  });
}
$('addItem').onclick=()=>{todos.push({text:'',done:false});buildItems();renderTodo();
  const ins=$('items').querySelectorAll('input[type=text]');ins[ins.length-1].focus();};
['ttitle','tfoot','tflip'].forEach(id=>$(id).addEventListener('input',renderTodo));
$('tflip').addEventListener('change',renderTodo);

const SERIF='Georgia,"Times New Roman","Noto Serif KR",serif';
const SANS='-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
const TIMES='"Times New Roman",Times,"Liberation Serif","Nimbus Roman",serif';
// 영어는 타임스, 한글은 타임스에 없으니까 고딕으로 빠지게
const ITEM='"Times New Roman",Times,"Liberation Serif","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif';

function fitFont(text,weight,size,family,maxW){
  do{t.font=`${weight} ${size}px ${family}`;size--;}while(size>8&&t.measureText(text).width>maxW);
}
function clip(text,maxW){
  if(t.measureText(text).width<=maxW) return text;
  while(text.length&&t.measureText(text+'…').width>maxW) text=text.slice(0,-1);
  return text+'…';
}
// 빗금 패턴 (손으로 그린 ToDo 글자 속 빗금)
function hatch(){
  const c=document.createElement('canvas');c.width=c.height=4;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,4,4);x.fillStyle='#000';
  for(let i=0;i<4;i++)x.fillRect(i,3-i,1,1);
  return t.createPattern(c,'repeat');
}
// 날짜로 정해지는 바코드
function barcode(x,y,w,h,seed){
  let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};
  t.fillStyle='#000';
  let cx=x,bar=true;
  while(cx<x+w){
    const bw=1+Math.floor(rnd()*3);
    if(bar) t.fillRect(cx,y,Math.min(bw,x+w-cx),h);
    cx+=bw;bar=!bar;
  }
}

function dashes(y,h){t.fillStyle='#000';for(let x=4;x<PW-4;x+=6)t.fillRect(x,y,3,h||1);}
function lr(left,right,y,font,color){
  t.font=font;t.fillStyle=color||'#000';
  const rw=right?t.measureText(right).width:0;
  t.textAlign='left';t.fillText(clip(left,PW-10-rw-6),5,y);
  if(right){t.textAlign='right';t.fillText(right,PW-5,y);}
  t.textAlign='left';
}

// 영수증 스타일
// 실제 화면은 ESP32가 FreeSerif 폰트로 직접 그림. 여기 미리보기는 같은 배치로 흉내낸 거
// 한글 항목만 폰이 그림으로 만들어서 보냄 (아래 itemBitmap)
const RW=80,RH=14,RB=RW/8;
const maxItems=()=>9;
const ic=document.createElement('canvas');ic.width=RW;ic.height=RH;
const ix=ic.getContext('2d',{willReadFrequently:true});
const ascii=s=>s.replace(/[^\x20-\x7E]/g,'');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dateStr(){const d=new Date();return `${DAY[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;}

function itemBitmap(text){
  ix.fillStyle='#fff';ix.fillRect(0,0,RW,RH);
  ix.font=`13px ${ITEM}`;ix.fillStyle='#000';ix.textBaseline='alphabetic';ix.textAlign='left';
  let s=text;
  if(ix.measureText(s).width>RW-1){while(s.length&&ix.measureText(s+'…').width>RW-1)s=s.slice(0,-1);s+='…';}
  ix.fillText(s,0,11);
  const w=Math.min(RW,Math.ceil(ix.measureText(s).width));
  const px=ix.getImageData(0,0,RW,RH).data,bits=new Uint8Array(RB*RH);
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    const i=(y*RW+x)*4;
    if(0.299*px[i]+0.587*px[i+1]+0.114*px[i+2]<150) bits[y*RB+(x>>3)]|=0x80>>(x&7);
  }
  return {bits,w};
}

// 기기(receipt_draw.h)랑 같은 배치
function drawReceipt(){
  const list=todos.filter(it=>it.text.trim()).slice(0,maxItems());
  const done=list.filter(it=>it.done).length;

  // 머리
  t.fillStyle='#000';t.textAlign='center';
  const title=ascii($('ttitle').value);
  fitFont(title||' ','',30,TIMES,118);
  t.fillText(title,PW/2,32);
  t.font=`13px ${TIMES}`;
  t.fillText(dateStr(),PW/2,49);
  dashes(55);

  // 항목
  t.font=`13px ${TIMES}`;
  const colC=PW-5-Math.round(t.measureText('Done').width/2);
  list.forEach((it,i)=>{
    const base=72+i*15,{bits,w}=itemBitmap(it.text);
    t.fillStyle='#000';
    for(let y=0;y<RH;y++)for(let x=0;x<RW;x++) if(bits[y*RB+(x>>3)]&(0x80>>(x&7))) t.fillRect(9+x,base-11+y,1,1);
    if(it.done){
      t.fillRect(8,base-4,w+2,1);
      t.font=`13px ${TIMES}`;t.textAlign='right';t.fillText('Done',PW-5,base);t.textAlign='left';
    }else t.fillRect(colC-3,base-4,7,1);
  });

  // 합계
  const B=PH-18, footBase=B-5, dashY=B-20, leftBase=dashY-5, doneBase=leftBase-13, totalBase=doneBase-14, lineY=totalBase-17;
  t.fillStyle='#000';t.fillRect(4,lineY,PW-8,1);
  lr('Total',`${done} / ${list.length}`,totalBase,`17px ${TIMES}`);
  lr('Done',String(done),doneBase,`13px ${TIMES}`);
  lr('Left',String(list.length-done),leftBase,`bold 13px ${TIMES}`,'#f00');
  dashes(dashY);

  // 꼬리
  const foot=ascii($('tfoot').value);
  if(foot){t.fillStyle='#000';t.textAlign='center';fitFont(foot,'',15,TIMES,118);t.fillText(foot,PW/2,footBase);}
  t.fillStyle='#000';
  // 바코드 (장식)
  let s=0;for(const ch of title)s=(s*31+ch.charCodeAt(0))>>>0;s=(s^list.length)||1;
  const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s;};
  let cx=12,bar=true;
  while(cx<PW-12){const bw=1+rnd()%3;if(bar)t.fillRect(cx,B,Math.min(bw,PW-12-cx),15);cx+=bw;bar=!bar;}
}

function renderTodo(){
  save();
  t.fillStyle='#fff';t.fillRect(0,0,PW,PH);
  t.textBaseline='alphabetic';
  if($('tstyle').value==='receipt') drawReceipt(); else drawNote();
  finishTodo();
}

// 손글씨 노트 스타일
function drawNote(){
  // 제목: 빗금 채운 세리프 글자 + 테두리
  const title=$('ttitle').value||' ';
  fitFont(title,'bold',46,SERIF,114);
  t.textAlign='center';
  t.fillStyle=hatch();t.fillText(title,PW/2,50);
  t.lineWidth=1.2;t.strokeStyle='#000';t.strokeText(title,PW/2,50);

  // 빨간 밑줄 + 점선
  t.fillStyle='#f00';t.fillRect(6,58,PW-12,3);
  t.fillStyle='#000';
  for(let x=6;x<PW-6;x+=9)t.fillRect(x,67,5,2);

  // 항목
  const list=todos.filter(it=>it.text.trim());
  const top=88,lh=19;
  const footY=PH-66;
  const maxRows=Math.floor((footY-14-top)/lh)+1;
  t.textAlign='left';
  list.slice(0,maxRows).forEach((it,i)=>{
    const y=top+i*lh;
    t.fillStyle='#000';
    t.font=`bold 13px ${SANS}`;
    t.fillText(clip(it.text,82),8,y);
    if(it.done){
      t.font=`13px ${SERIF}`;t.textAlign='right';
      t.fillText('Done',PW-7,y);t.textAlign='left';
    }
  });
  if(list.length>maxRows){t.font=`11px ${SANS}`;t.fillText(`+${list.length-maxRows}개 더`,8,top+maxRows*lh-4);}

  // 맺음말 + 바코드
  const foot=$('tfoot').value;
  if(foot){fitFont(foot,'',17,SERIF,112);t.textAlign='center';t.fillStyle='#000';t.fillText(foot,PW/2,footY);}
  const d=new Date();
  barcode(12,PH-50,PW-24,32,`${d.getFullYear()}${d.getMonth()}${d.getDate()}${list.length}`);
}

function finishTodo(){
  // 3색으로 끊기 (글자 가장자리 회색은 반 기준으로 자름)
  const px=t.getImageData(0,0,PW,PH).data;
  const p3=new Uint8Array(PW*PH);
  for(let p=0,i=0;p<PW*PH;p++,i+=4){
    const r=px[i],g=px[i+1],b=px[i+2];
    if(r-Math.max(g,b)>70) p3[p]=2;
    else p3[p]=(0.299*r+0.587*g+0.114*b)<150?1:0;
  }
  paint(tctx,p3,PW,PH);

  // 가로 296x128 버퍼로 돌리기: 패널을 시계방향으로 90도 돌려 세운 기준
  const flip=$('tflip').checked;
  res=new Uint8Array(N);
  for(let py=0;py<PH;py++)for(let px2=0;px2<PW;px2++){
    let x=py,y=PW-1-px2;
    if(flip){x=W-1-x;y=H-1-y;}
    res[y*W+x]=p3[py*PW+px2];
  }
}
buildItems();

setMode('todo');   // 할 일 탭으로 시작

// 기기에서 읽어온 상태로 화면 채우기
function loadState(txt){
  const items=[];let done='';
  txt.split('\n').forEach(line=>{
    const i=line.indexOf('=');if(i<0)return;
    const k=line.slice(0,i),v=line.slice(i+1);
    if(k==='item')items.push(v);
    else if(k==='done')done=v;
    else if(k==='title')$('ttitle').value=v;
    else if(k==='foot')$('tfoot').value=v;
    else if(k==='flip')$('tflip').checked=v==='1';
  });
  if(items.length){
    $('tstyle').value='receipt';lastStyle='receipt';
    todos=items.map((text,i)=>({text,done:done[i]==='1'}));
    buildItems();setMode('todo');
  }
}

/* ================= 보내기 ================= */
// 검정 판 + 빨강 판, 1비트 = 칠함, MSB부터
function pack(){
  const n=N/8,buf=new Uint8Array(n*2);
  for(let p=0;p<N;p++){
    const by=p>>3,bit=0x80>>(p&7);
    if(res[p]===1) buf[by]|=bit;
    else if(res[p]===2) buf[n+by]|=bit;
  }
  return buf;
}

/* ================= 블루투스 ================= */
const SVC='7e9a0001-5c3b-4c55-9d7e-2b1a00e9a001';
const RX='7e9a0002-5c3b-4c55-9d7e-2b1a00e9a001';
const TX='7e9a0003-5c3b-4c55-9d7e-2b1a00e9a001';
const STATE='7e9a0004-5c3b-4c55-9d7e-2b1a00e9a001';
let dev=null,rx=null,stateCh=null,waiters=[];
const bstat=t=>$('bstat').textContent=t;

function waitFor(word,ms){
  return new Promise((res,rej)=>{
    const w={word,res};waiters.push(w);
    setTimeout(()=>{waiters=waiters.filter(x=>x!==w);rej(new Error('기기 응답이 없어'));},ms);
  });
}
function onTx(e){
  const msg=new TextDecoder().decode(e.target.value);
  if(msg.startsWith('err')){waiters.forEach(w=>w.res(msg));waiters=[];return;}
  waiters.filter(w=>w.word===msg).forEach(w=>w.res(msg));
  waiters=waiters.filter(w=>w.word!==msg);
}

async function connect(){
  if(!navigator.bluetooth){msg('이 브라우저는 블루투스를 못 써. 안드로이드 크롬에서 열어줘');return false;}
  try{
    if(!dev){
      dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
      dev.addEventListener('gattserverdisconnected',()=>{rx=null;bstat('끊김 · 다시 연결하려면 기기 버튼 꾹');$('conn').textContent='기기 연결';});
    }
    bstat('연결 중…');
    const gatt=await dev.gatt.connect();
    const svc=await gatt.getPrimaryService(SVC);
    rx=await svc.getCharacteristic(RX);
    const tx=await svc.getCharacteristic(TX);
    await tx.startNotifications();
    tx.addEventListener('characteristicvaluechanged',onTx);
    stateCh=await svc.getCharacteristic(STATE);
    const st=new TextDecoder().decode(await stateCh.readValue());
    loadState(st);
    bstat('연결됨');
    $('conn').textContent='다시 불러오기';
    return true;
  }catch(e){
    if(e.name==='NotFoundError'){bstat('기기를 안 골랐어');}
    else{bstat('연결 실패 · 기기 LED가 깜빡이는지 확인해줘');dev=null;}
    return false;
  }
}
$('conn').onclick=connect;

let CHUNK=180;
async function sendBytes(type,data){
  const head=new Uint8Array(6);head[0]=1;head[1]=type;
  new DataView(head.buffer).setUint32(2,data.length,true);
  await rx.writeValueWithResponse(head);
  for(let i=0;i<data.length;i+=CHUNK){
    const part=data.subarray(i,i+CHUNK),pkt=new Uint8Array(part.length+1);
    pkt[0]=2;pkt.set(part,1);
    await rx.writeValueWithResponse(pkt);
    msg(`보내는 중… ${Math.min(100,Math.round((i+part.length)/data.length*100))}%`);
  }
  const ok=waitFor('ok',5000);
  await rx.writeValueWithResponse(new Uint8Array([3]));
  const r=await ok;
  if(r!=='ok') throw new Error(r);
}

async function upload(type,data){
  $('send').disabled=true;
  try{
    if(!rx&&!(await connect())){$('send').disabled=false;return;}
    const drawn=waitFor('drawn',40000);
    try{await sendBytes(type,data);}
    catch(e){ if(CHUNK>20){CHUNK=20;await sendBytes(type,data);} else throw e; }  // 큰 조각이 안 먹으면 작게
    msg('받았어. 화면 갱신 중… (15초쯤 깜빡여)');
    const r=await drawn;
    if(stateCh){const st=new TextDecoder().decode(await stateCh.readValue());loadState(st);}
    msg(r==='drawn'?'끝. 이제 패널 빼도 그대로 남아':'실패: '+r);
  }catch(e){
    msg('보내다 끊겼어: '+e.message);
  }
  $('send').disabled=false;
}

// 영수증: 글자 정보 + 항목 그림만 보내고 그리기는 기기가 함 (그래야 손잡이로 체크 가능)
function sendTodo(){
  const list=todos.filter(it=>it.text.trim());
  if(!list.length){msg('할 일을 하나 이상 적어줘');return;}
  if(list.length>maxItems()){msg(`한 화면에 ${maxItems()}개까지만 들어가. 지금 ${list.length}개야`);return;}
  const bmp=new Uint8Array(list.length*RB*RH),ws=[];
  list.forEach((it,i)=>{const b=itemBitmap(it.text);bmp.set(b.bits,i*RB*RH);ws.push(b.w);});
  const lines=[
    'title='+ascii($('ttitle').value).slice(0,23),
    'foot='+ascii($('tfoot').value).slice(0,23),
    'date='+dateStr(),
    'n='+list.length,
    'done='+list.map(it=>it.done?'1':'0').join(''),
    'w='+ws.join(','),
    'flip='+($('tflip').checked?'1':'0'),
    ...list.map(it=>'item='+it.text.replace(/\n/g,' ').slice(0,40)),
  ];
  const hdr=new TextEncoder().encode(lines.join('\n'));
  const data=new Uint8Array(2+hdr.length+bmp.length);
  data[0]=hdr.length&255;data[1]=hdr.length>>8;
  data.set(hdr,2);data.set(bmp,2+hdr.length);
  upload(1,data);
}

$('send').onclick=()=>{
  if(mode==='todo'&&$('tstyle').value==='receipt'){sendTodo();return;}
  if(mode==='todo') renderTodo();
  if(!res) return;
  upload(2,pack());
};
